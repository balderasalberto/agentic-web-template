[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-application-template"
version = "3.1.0"
description = "Provider-neutral minimum viable harness for governed agentic software delivery"
requires-python = ">=3.10"

[project.scripts]
agentic = "agentic_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
